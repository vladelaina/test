name: ✨ 功能请求
description: "💡 提交一个功能建议"
title: "[✨功能请求]: "
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |-
        ## ✨ 功能请求

        ## ✨ Feature Request

        💡 有好想法？欢迎分享你的创意！

        💡 Got a great idea? Share your creativity with us!

  - type: markdown
    attributes:
      value: |-
        ### 🌈 你希望加入的功能

        ### 🌈 Feature You'd Like

        请简要描述你希望添加或改进的功能。让我们一起把软件做得更好！

        Briefly describe the feature you'd like to add or improve. Let's make the software even better together!
  - type: input
    id: problem
    attributes:
      label: 🌈 你希望加入的功能
    validations:
      required: false

  - type: markdown
    attributes:
      value: |-
        ### 🚀 理想的解决方案

        ### 🚀 Ideal Solution

        你心中理想的解决方案是什么样的？请尽情发挥想象，不用担心技术细节！

        What does your perfect solution look like? Feel free to use your imagination - don't worry about technical details!
  - type: textarea
    id: way-to-solve
    attributes:
      label: 🚀 理想的解决方案
    validations:
      required: true

  - type: markdown
    attributes:
      value: |-
        ### 🤔 替代方案（可选）

        ### 🤔 Alternative Solutions (Optional)

        如果你还有其他想法，也欢迎在这里补充。想法越多越好！

        If you have other ideas, please share them here. The more, the merrier!
  - type: textarea
    id: instead
    attributes:
      label: 🤔 替代方案（可选）
    validations:
      required: false

  - type: markdown
    attributes:
      value: |-
        ### ✅ 最后确认

        ### ✅ Final Step

        在提交你的精彩想法前，请确认以下内容：

        Before submitting your brilliant idea, please confirm the following:

        🌟 我已检查最新版本，并确认我请求的功能尚未实现。

        🌟 I've checked the latest version and confirmed my requested feature isn't already implemented.

        📋 我已查看现有功能请求，确认这不是重复提交。

        📋 I've reviewed existing feature requests to make sure this isn't a duplicate.
  - type: checkboxes
    id: "latest-version"
    attributes:
      label: ✅ 最后确认
      options:
        - label: "🌟 我已检查最新版本，并确认我请求的功能尚未实现。"
          required: true
        - label: "📋 我已查看现有功能请求，确认这不是重复提交。"
          required: true
