name: Outlook Register with Xray

on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: 'Number of accounts to register'
        required: true
        default: '1'
        type: string

jobs:
  register:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install playwright requests
        playwright install chromium
        playwright install-deps

    - name: Setup Xray
      env:
        SUB_URL: ${{ secrets.PROXY }}
      run: |
        # 下载 Xray-core
        wget -O xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
        unzip xray.zip -d xray-bin
        chmod +x xray-bin/xray
        
        # 生成配置
        # 这里会生成 proxy_config.json
        python convert_sub.py
        
        # 检查是否成功生成了配置
        if [ ! -s proxy_config.json ] || [ "$(cat proxy_config.json)" == "{}" ]; then
          echo "Error: Proxy config generation failed."
          exit 1
        fi

        mv proxy_config.json xray-bin/config.json
        
        # 启动 Xray (后台运行)
        cd xray-bin
        nohup ./xray run -c config.json > xray.log 2>&1 &
        cd ..
        
        # 等待 Xray 启动
        sleep 3
        echo "Xray log tail:"
        tail -n 20 xray-bin/xray.log || echo "No log yet"

    - name: Check Files
      run: ls -l # 调试用：列出当前文件，确认 config.json 是否存在

    - name: Run Registration
      env:
        MAX_TASKS: ${{ inputs.max_tasks }}
        CONCURRENT_FLOWS: 1
        HEADLESS: true
        BROWSER_PATH: ""
        Bot_protection_wait: 10
      run: |
        xvfb-run python OutlookRegister.py

    - name: Upload Results & Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: registration-results
        path: |
          Results/
          xray-bin/xray.log
          xray-bin/config.json
