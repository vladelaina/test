name: Outlook Register

on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: 'Number of accounts to register'
        required: true
        default: '1'
        type: string

jobs:
  register:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install playwright
        playwright install chromium
        playwright install-deps

    - name: Run Registration
      env:
        PROXY: ${{ secrets.PROXY }}
        MAX_TASKS: ${{ inputs.max_tasks }}
        CONCURRENT_FLOWS: 1
        HEADLESS: true
        BROWSER_PATH: ""
        Bot_protection_wait: 10
      run: |
        xvfb-run python OutlookRegister.py

    - name: Upload Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: registration-results
        path: Results/
