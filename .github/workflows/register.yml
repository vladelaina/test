name: Outlook Register with v2ray

on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: 'Number of accounts to register'
        required: true
        default: '1'
        type: string

jobs:
  register:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install playwright requests
        playwright install chromium
        playwright install-deps

    - name: Setup v2ray
      env:
        SUB_URL: ${{ secrets.PROXY }}
      run: |
        # 下载 v2ray-core
        wget -O v2ray.zip https://github.com/v2fly/v2ray-core/releases/latest/download/v2ray-linux-64.zip
        unzip v2ray.zip -d v2ray-bin
        chmod +x v2ray-bin/v2ray
        
        # 生成配置
        python convert_sub.py
        mv config.json v2ray-bin/config.json
        
        # 启动 v2ray (后台运行)
        cd v2ray-bin
        nohup ./v2ray run -config config.json > v2ray.log 2>&1 &
        cd ..
        
        # 等待 v2ray 启动
        sleep 3
        echo "v2ray log tail:"
        tail -n 20 v2ray-bin/v2ray.log || echo "No log yet"

    - name: Run Registration
      env:
        MAX_TASKS: ${{ inputs.max_tasks }}
        CONCURRENT_FLOWS: 1
        HEADLESS: true
        BROWSER_PATH: ""
        Bot_protection_wait: 10
      run: |
        xvfb-run python OutlookRegister.py

    - name: Upload Results & Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: registration-results
        path: |
          Results/
          v2ray-bin/v2ray.log
          v2ray-bin/config.json
