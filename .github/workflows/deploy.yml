name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check if already initialized
        id: check
        run: |
          if [ -f "package.json" ]; then
            echo "initialized=true" >> $GITHUB_OUTPUT
          else
            echo "initialized=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Docusaurus project (if not initialized)
        if: steps.check.outputs.initialized == 'false'
        run: |
          npx create-docusaurus@latest temp-site classic --javascript
          # 使用 cp 而不是 mv，避免覆盖已有文件夹的问题
          cp -rn temp-site/* . 2>/dev/null || true
          cp -rn temp-site/.* . 2>/dev/null || true
          rm -rf temp-site

      - name: Configure for Blog-only mode
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          
          # 修改 docusaurus.config.js：设置 baseUrl 和博客为首页
          sed -i "s|baseUrl: '/'|baseUrl: '/${REPO_NAME}/'|g" docusaurus.config.js
          
          # 配置博客为首页，禁用文档功能
          sed -i "s|docs: {|docs: false, _docs: {|g" docusaurus.config.js
          sed -i "s|blog: {|blog: { routeBasePath: '/', |g" docusaurus.config.js
          
          # 删除默认主页
          rm -f src/pages/index.js src/pages/index.tsx src/pages/index.module.css
          
          # 移除导航栏中的文档链接
          sed -i "s|{type: 'docSidebar'.*}|/* removed */|g" docusaurus.config.js
          sed -i "s|{to: '/docs/intro'.*}|/* removed */|g" docusaurus.config.js

      - name: Install dependencies and Build
        run: |
          npm install
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
