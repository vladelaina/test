name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check if already initialized
        id: check
        run: |
          if [ -f "package.json" ]; then
            echo "initialized=true" >> $GITHUB_OUTPUT
          else
            echo "initialized=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Docusaurus project (if not initialized)
        if: steps.check.outputs.initialized == 'false'
        run: |
          npx create-docusaurus@latest temp-site classic --javascript
          # 使用 cp 而不是 mv，避免覆盖已有文件夹的问题
          cp -rn temp-site/* . 2>/dev/null || true
          cp -rn temp-site/.* . 2>/dev/null || true
          rm -rf temp-site

      - name: Configure for Docs-only mode
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          
          # 直接创建一个干净的文档专用配置文件
          cat > docusaurus.config.js << CONFIGEOF
          import {themes as prismThemes} from 'prism-react-renderer';
          
          /** @type {import('@docusaurus/types').Config} */
          const config = {
            title: 'My Docs',
            tagline: 'Welcome',
            favicon: 'img/favicon.ico',
            url: 'https://${GITHUB_REPOSITORY_OWNER}.github.io',
            baseUrl: '/${REPO_NAME}/',
            organizationName: '${GITHUB_REPOSITORY_OWNER}',
            projectName: '${REPO_NAME}',
            onBrokenLinks: 'ignore',
            onBrokenMarkdownLinks: 'ignore',
            i18n: {
              defaultLocale: 'en',
              locales: ['en'],
            },
            presets: [
              [
                'classic',
                /** @type {import('@docusaurus/preset-classic').Options} */
                ({
                  docs: {
                    routeBasePath: '/',
                    path: 'content',
                    sidebarPath: './sidebars.js',
                  },
                  blog: false,
                  theme: {
                    customCss: './src/css/custom.css',
                  },
                }),
              ],
            ],
            themeConfig:
              /** @type {import('@docusaurus/preset-classic').ThemeConfig} */
              ({
                navbar: {
                  title: 'My Docs',
                  items: [
                    {
                      href: 'https://github.com/${GITHUB_REPOSITORY}',
                      label: 'GitHub',
                      position: 'right',
                    },
                  ],
                },
                footer: {
                  style: 'dark',
                  copyright: 'Built with Docusaurus.',
                },
                prism: {
                  theme: prismThemes.github,
                  darkTheme: prismThemes.dracula,
                },
              }),
          };
          
          export default config;
          CONFIGEOF
          
          # 删除不需要的文件
          rm -rf blog src/pages src/components docs
          
          # 创建 content 目录
          mkdir -p content
          
          # 复制根目录下的 md 文件（除了 README.md）
          find . -maxdepth 1 -name "*.md" ! -name "README.md" -exec cp {} content/ \;
          
          # 复制用户的文件夹（排除 . 开头的、node_modules、src、static、build、content）
          for dir in */; do
            case "$dir" in
              .*|node_modules/|src/|static/|build/|content/|temp-site/) ;;
              *) cp -r "$dir" content/ 2>/dev/null || true ;;
            esac
          done
          
          # 设置第一个文档为首页
          FIRST_DOC=$(find content -maxdepth 1 -name "*.md" | head -1)
          if [ -n "$FIRST_DOC" ]; then
            if ! grep -q "slug: /" "$FIRST_DOC"; then
              sed -i '1s/^/---\nslug: \/\n---\n\n/' "$FIRST_DOC"
            fi
          fi

      - name: Install dependencies and Build
        run: |
          npm install
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
