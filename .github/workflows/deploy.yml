name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check if already initialized
        id: check
        run: |
          if [ -f "package.json" ]; then
            echo "initialized=true" >> $GITHUB_OUTPUT
          else
            echo "initialized=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Docusaurus project (if not initialized)
        if: steps.check.outputs.initialized == 'false'
        run: |
          npx create-docusaurus@latest temp-site classic --javascript
          # 使用 cp 而不是 mv，避免覆盖已有文件夹的问题
          cp -rn temp-site/* . 2>/dev/null || true
          cp -rn temp-site/.* . 2>/dev/null || true
          rm -rf temp-site

      - name: Configure for Blog-only mode
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          
          # 使用 Node.js 脚本修改配置
          node << 'EOF'
          const fs = require('fs');
          const repoName = process.env.GITHUB_REPOSITORY.split('/')[1];
          
          let config = fs.readFileSync('docusaurus.config.js', 'utf8');
          
          // 设置 baseUrl
          config = config.replace("baseUrl: '/'", `baseUrl: '/${repoName}/'`);
          
          // 禁用 docs，设置 blog 为首页
          config = config.replace(
            /docs:\s*\{[^}]*sidebarPath[^}]*\}/s,
            'docs: false'
          );
          config = config.replace(
            /blog:\s*\{/,
            "blog: {\n          routeBasePath: '/',"
          );
          
          // 移除导航栏中的 docs 相关链接
          config = config.replace(/\{type:\s*'docSidebar'[^}]*\},?/g, '');
          config = config.replace(/\{to:\s*'\/docs\/intro'[^}]*\},?/g, '');
          
          fs.writeFileSync('docusaurus.config.js', config);
          console.log('Config updated successfully');
          EOF
          
          # 删除默认主页
          rm -f src/pages/index.js src/pages/index.tsx src/pages/index.module.css

      - name: Install dependencies and Build
        run: |
          npm install
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
